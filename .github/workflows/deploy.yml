name: deploy

# Publishes the built site to GitHub Pages on every push to main.
#
# The build itself is the same one CI already runs, including check-diagrams and the docs sync, so a
# broken diagram or a dead cross-page link fails here before anything is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs id-token to mint its deployment credential; contents:read is all the checkout needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish, but only queue one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
