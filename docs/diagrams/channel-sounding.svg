<svg viewBox="0 0 860 560" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
        <title id="archify-diagram-title">One ranging session</title>
        <desc id="archify-diagram-description">A sequence diagram generated by Archify.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Time Segments -->
        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" data-composition-frame-id="0" x="48" y="150" width="764" height="138" rx="10" class="c-lane" stroke-width="1"/>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" data-composition-frame-id="1" x="48" y="304" width="764" height="96" rx="10" class="c-lane" stroke-width="1"/>

        <rect data-graph-role="structural-frame" data-composition-frame-kind="segment" data-composition-frame-id="2" x="48" y="416" width="764" height="84" rx="10" class="c-lane" stroke-width="1"/>

        <!-- Lifelines -->
        <path d="M 157 142 L 157 495" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 441 142 L 441 495" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>
        <path d="M 725 142 L 725 495" class="a-default" stroke-width="0.8" stroke-dasharray="3,7"/>

        <!-- Activations -->
        <rect x="436" y="174" width="10" height="296" rx="3" class="c-mask"/>
        <rect x="436" y="174" width="10" height="296" rx="3" class="c-backend" stroke-width="1"/>
        <rect x="720" y="216" width="10" height="168" rx="3" class="c-mask"/>
        <rect x="720" y="216" width="10" height="168" rx="3" class="c-external" stroke-width="1"/>

        <!-- Messages -->
        <g data-edge-from="hook" data-edge-to="radio" data-edge-label="startRanging({ peerAddress })" data-edge-key="0">
          <path data-composition-edge-from="hook" data-composition-edge-to="radio" data-composition-points="164,180;434,180" d="M 164 180 L 434 180" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="217.6" y="160" width="162.8" height="16" rx="3" class="c-mask"/>
          <text x="299" y="170" class="t-backend" font-size="9" text-anchor="middle">startRanging({ peerAddress })</text>
        </g>
        </g>

        <g data-edge-from="radio" data-edge-to="peer" data-edge-label="platform sets up the session" data-edge-key="1">
          <path data-composition-edge-from="radio" data-composition-edge-to="peer" data-composition-points="448,222;718,222" d="M 448 222 L 718 222" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="504.2" y="202" width="157.6" height="16" rx="3" class="c-mask"/>
          <text x="583" y="212" class="t-backend" font-size="9" text-anchor="middle">platform sets up the session</text>
        </g>
        </g>

        <g data-edge-from="peer" data-edge-to="radio" data-edge-label="peer answers, or the open fails" data-edge-key="2">
          <path data-composition-edge-from="peer" data-composition-edge-to="radio" data-composition-points="718,264;448,264" d="M 718 264 L 448 264" class="a-default" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g data-detail="context">
          <rect x="496.4" y="244" width="173.20000000000002" height="16" rx="3" class="c-mask"/>
          <text x="583" y="254" class="t-muted" font-size="9" text-anchor="middle">peer answers, or the open fails</text>
        </g>
        </g>

        <g data-edge-from="radio" data-edge-to="hook" data-edge-label="onOpened, or a status and reason" data-edge-key="3">
          <path data-composition-edge-from="radio" data-composition-edge-to="hook" data-composition-points="434,326;164,326" d="M 434 326 L 164 326" class="a-default" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g data-detail="context">
          <rect x="209.8" y="306" width="178.4" height="16" rx="3" class="c-mask"/>
          <text x="299" y="316" class="t-muted" font-size="9" text-anchor="middle">onOpened, or a status and reason</text>
        </g>
        </g>

        <g data-edge-from="radio" data-edge-to="peer" data-edge-label="ranging rounds, run by the platform" data-edge-key="4">
          <path data-composition-edge-from="radio" data-composition-edge-to="peer" data-composition-points="448,368;718,368" d="M 448 368 L 718 368" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <g data-detail="context">
          <rect x="486" y="348" width="194" height="16" rx="3" class="c-mask"/>
          <text x="583" y="358" class="t-backend" font-size="9" text-anchor="middle">ranging rounds, run by the platform</text>
        </g>
        </g>

        <g data-edge-from="radio" data-edge-to="hook" data-edge-label="RangingData: distance, confidence, rssi" data-edge-key="5">
          <path data-composition-edge-from="radio" data-composition-edge-to="hook" data-composition-points="434,452;164,452" d="M 434 452 L 164 452" class="a-default" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
        <g data-detail="context">
          <rect x="191.6" y="432" width="214.8" height="16" rx="3" class="c-mask"/>
          <text x="299" y="442" class="t-muted" font-size="9" text-anchor="middle">RangingData: distance, confidence, rssi</text>
        </g>
        </g>

        <!-- Segment Labels -->
        <g data-graph-role="segment-label" data-segment-id="0">
          <rect x="56" y="128" width="42" height="18" rx="3" class="c-mask"/>
          <text x="62" y="141" class="t-dim" font-size="9" font-weight="600">Open</text>
        </g>
        <g data-graph-role="segment-label" data-segment-id="1">
          <rect x="56" y="282" width="42" height="18" rx="3" class="c-mask"/>
          <text x="62" y="295" class="t-dim" font-size="9" font-weight="600">Range</text>
        </g>
        <g data-graph-role="segment-label" data-segment-id="2">
          <rect x="56" y="394" width="45.2" height="18" rx="3" class="c-mask"/>
          <text x="62" y="407" class="t-dim" font-size="9" font-weight="600">Report</text>
        </g>

        <!-- Participants -->
        <g id="node-hook" data-node-id="hook" data-node-label="useChannelSounding" tabindex="0" role="button" aria-label="Focus useChannelSounding, your app, Sequence participant" aria-pressed="false" data-node-kind="frontend" data-node-sublabel="your app" data-node-context="Sequence participant">
          <title>useChannelSounding · your app · Sequence participant</title>
          <rect x="62" y="72" width="190" height="54" rx="6" class="c-mask"/>
          <rect x="62" y="72" width="190" height="54" rx="6" class="c-frontend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="frontend" class="semantic-sigil s-frontend" transform="translate(68 78) scale(0.6875)">
            <rect x="2" y="3" width="12" height="10" rx="2"/>
            <path d="M2 6.5h12"/>
            <circle cx="4.1" cy="4.8" r=".7" class="sigil-fill"/>
            <circle cx="6.3" cy="4.8" r=".7" class="sigil-fill"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="157" y="94" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">useChannelSounding</text>
          <text data-detail="context" x="157" y="111" class="t-muted" font-size="7" text-anchor="middle">your app</text>
        </g>

        <g id="node-radio" data-node-id="radio" data-node-label="RangingManager" tabindex="0" role="button" aria-label="Focus RangingManager, android.ranging session, Sequence participant" aria-pressed="false" data-node-kind="backend" data-node-sublabel="android.ranging session" data-node-context="Sequence participant">
          <title>RangingManager · android.ranging session · Sequence participant</title>
          <rect x="346" y="72" width="190" height="54" rx="6" class="c-mask"/>
          <rect x="346" y="72" width="190" height="54" rx="6" class="c-backend" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="backend" class="semantic-sigil s-backend" transform="translate(352 78) scale(0.6875)">
            <path d="M6 3 3 8l3 5M10 3l3 5-3 5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="441" y="94" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">RangingManager</text>
          <text data-detail="context" x="441" y="111" class="t-muted" font-size="7" text-anchor="middle">android.ranging session</text>
        </g>

        <g id="node-peer" data-node-id="peer" data-node-label="Channel Sounding peer" tabindex="0" role="button" aria-label="Focus Channel Sounding peer, Bluetooth device at peerAddress, Sequence participant" aria-pressed="false" data-node-kind="external" data-node-sublabel="Bluetooth device at peerAddress" data-node-context="Sequence participant">
          <title>Channel Sounding peer · Bluetooth device at peerAddress · Sequence participant</title>
          <rect x="630" y="72" width="190" height="54" rx="6" class="c-mask"/>
          <rect x="630" y="72" width="190" height="54" rx="6" class="c-external" stroke-width="1.5"/>
          <g aria-hidden="true" data-semantic-sigil="external" class="semantic-sigil s-external" transform="translate(636 78) scale(0.6875)">
            <rect x="2.5" y="5" width="8.5" height="8" rx="1.5"/>
            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="725" y="94" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Channel Sounding peer</text>
          <text data-detail="context" x="725" y="111" class="t-muted" font-size="7" text-anchor="middle">Bluetooth device at peerAddress</text>
        </g>

        <!-- Legend -->
        <g data-legend="">
          <text x="40" y="486" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="emphasis" data-legend-x="40" data-legend-baseline="506" data-legend-width="78">
            <path d="M 40 503 L 74 503" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
            <text x="83" y="506" class="t-muted" font-size="10" font-weight="500">request</text>
          </g>
          <g data-legend-semantic-kind="return" data-legend-x="140" data-legend-baseline="506" data-legend-width="73">
            <path d="M 140 503 L 174 503" class="a-default" stroke-width="1.4" stroke-dasharray="3,5" marker-end="url(#arrowhead)"/>
            <text x="183" y="506" class="t-muted" font-size="10" font-weight="500">return</text>
          </g>
        </g>
      </svg>
